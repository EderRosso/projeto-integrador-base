<p>status-card works!</p>
<div class="card-resultado">
  <div class="card-cabecalho">
    <h3 class="placa">{{ veiculo().placa }}</h3>
    <span class="modelo">{{ veiculo().modelo }}</span>
  </div>
  
  <div class="card-corpo">
    <div class="status-box">
      <span class="status-label">Estado Atual:</span>
      <span 
        class="status-badge"
        [class.status-aguardando]="veiculo().statusAtual.includes('Aguardando')"
        [class.status-reparo]="veiculo().statusAtual.includes('Reparo')"
        [class.status-pronto]="veiculo().statusAtual.includes('Pronto')"
      >
        {{ veiculo().statusAtual }}
      </span>
    </div>
    
    <div class="data-box">
      <span class="data-label">Última atualização:</span>
      <span class="data-valor">{{ veiculo().dataAtualizacao | date:'dd/MM/yyyy' }}</span>
    </div>
  </div>
</div>
