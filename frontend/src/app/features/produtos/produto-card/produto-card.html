<article class="cartao-produto">
  <span class="etiqueta">{{ produto().categoria }}</span>
  <h2>{{ produto().nome }}</h2>
  <p class="preco">{{ produto().preco | currency: 'BRL' }}</p>

  @if (produto().estoque === 0) {
    <p class="sem-estoque">Sem estoque</p>
  } @else {
    <p class="estoque">{{ produto().estoque }} em estoque</p>
  }

  <div class="acoes">
    <a class="botao secundario" [routerLink]="['/produtos', produto()._id, 'editar']">Editar</a>
    <button type="button" class="botao perigo" (click)="pedirExclusao()">Excluir</button>
  </div>
</article>
