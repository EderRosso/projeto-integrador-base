<div class="container mt-4">
  <h2>Painel do Mecânico - Fluxo de Estados</h2>

  @if (carregando()) {
    <p>A carregar ordens de serviço...</p>
  }

  @if (erro()) {
    <div class="alert alert-danger">{{ erro() }}</div>
  }

  @if (!carregando() && ordens().length === 0) {
    <div class="alert alert-info">Nenhuma ordem de serviço encontrada.</div>
  }

  <div class="row mt-3">
    @for (os of ordens(); track os._id) {
      <div class="col-md-4">
        <app-ordem-servico-card [os]="os" (mudarStatus)="onMudarStatus(os._id, $event)" />
      </div>
    }
  </div>
</div>
