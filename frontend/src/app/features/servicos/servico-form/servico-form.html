<div class="container-form">
  <h2>Cadastrar Novo Serviço no Catálogo</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nome">Nome do Serviço *</label>
      <input id="nome" type="text" formControlName="nome" placeholder="Ex: Troca de Óleo" />
    </div>

    <div class="form-group">
      <label for="descricao">Descrição *</label>
      <textarea id="descricao" formControlName="descricao" rows="3" placeholder="Ex: Substituição do óleo..."></textarea>
    </div>

    <div class="form-group">
      <label for="preco">Preço (R$) *</label>
      <input id="preco" type="number" step="0.01" formControlName="preco" placeholder="150.00" />
    </div>

    <div class="form-group">
      <label for="tempoEstimado">Tempo Estimado *</label>
      <input id="tempoEstimado" type="text" formControlName="tempoEstimado" placeholder="Ex: 45 min" />
    </div>

    <div class="form-actions">
      <button type="button" routerLink="/painel/servicos" class="btn-secondary">Cancelar</button>
      <button type="submit" class="btn-primary">Salvar Serviço</button>
    </div>
  </form>
</div>
