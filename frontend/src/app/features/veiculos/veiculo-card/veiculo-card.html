<article class="veiculo-card">
    <header class="veiculo-card-header">
        <div class="veiculo-identificacao">
            <span class="status-chip" [class.status-fila]="veiculo().status === 'Na Fila'"
                [class.status-conserto]="veiculo().status === 'Em Conserto'"
                [class.status-pronto]="veiculo().status === 'Pronto'" [class.status-outro]="
          veiculo().status !== 'Na Fila' &&
          veiculo().status !== 'Em Conserto' &&
          veiculo().status !== 'Pronto'
        ">
                {{ veiculo().status }}
            </span>

            <h3>{{ veiculo().modelo }}</h3>
            <p class="placa">{{ veiculo().placa }}</p>
        </div>
    </header>

    <div class="veiculo-card-dados">
        <div class="imagem-veiculo">
            @if (veiculo().imagemUrl && !imagemComErro()) {
            <img [src]="veiculo().imagemUrl" [alt]="'Imagem do veículo ' + veiculo().modelo"
                (error)="imagemComErro.set(true)" />
            } @else {
            <img src="/assets/img/veiculo-placeholder.webp" alt="Imagem não disponível para este veículo" />
            }
        </div>
        <div class="dado">
            <span class="dado-label">Cliente</span>
            <strong>{{ clienteNome() }}</strong>
        </div>

        <div class="dados-veiculo">
            <div class="dado">
                <span class="dado-label">Ano</span>
                <strong>{{ veiculo().ano }}</strong>
            </div>

            <div class="dado">
                <span class="dado-label">Cor</span>
                <strong>{{ veiculo().cor }}</strong>
            </div>
        </div>

        <div class="dado problema">
            <span class="dado-label">Defeito relatado</span>
            <p>{{ veiculo().defeitoRelatado }}</p>
        </div>
    </div>

    <footer class="veiculo-card-acoes">
        <button type="button" class="btn-editar" (click)="editar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z" />
            </svg>
            Editar veículo
        </button>
        <button type="button" class="botao-excluir" (click)="$event.stopPropagation(); excluir.emit(veiculo())">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier">
                    <path
                        d="M18 6L17.1991 18.0129C17.129 19.065 17.0939 19.5911 16.8667 19.99C16.6666 20.3412 16.3648 20.6235 16.0011 20.7998C15.588 21 15.0607 21 14.0062 21H9.99377C8.93927 21 8.41202 21 7.99889 20.7998C7.63517 20.6235 7.33339 20.3412 7.13332 19.99C6.90607 19.5911 6.871 19.065 6.80086 18.0129L6 6M4 6H20M16 6L15.7294 5.18807C15.4671 4.40125 15.3359 4.00784 15.0927 3.71698C14.8779 3.46013 14.6021 3.26132 14.2905 3.13878C13.9376 3 13.523 3 12.6936 3H11.3064C10.477 3 10.0624 3 9.70951 3.13878C9.39792 3.26132 9.12208 3.46013 8.90729 3.71698C8.66405 4.00784 8.53292 4.40125 8.27064 5.18807L8 6"
                        stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                </g>
            </svg>
            Excluir
        </button>
    </footer>
</article>
